name: Windows

on: [push, pull_request]

permissions: read-all

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: Build - ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ykman-builds-windows-x64
          - os: windows-11-arm
            artifact: ykman-builds-windows-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-about
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-about

      - name: Build Rust CLI
        shell: bash
        run: |
          cargo build --release -p ykman-cli -p ykman-svc
          mkdir -p dist/ykman
          cp target/release/ykman.exe dist/ykman/
          cp target/release/ykman-svc.exe dist/ykman/
          dist/ykman/ykman.exe --version

      - name: Copy scripts
        shell: bash
        run: cp -r resources/win dist/scripts

      - name: Install WiX for ARM64 validation
        if: matrix.os == 'windows-11-arm'
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          Invoke-WebRequest 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31') {
            throw 'WiX download checksum mismatch'
          }
          $wixDir = Join-Path $env:RUNNER_TEMP 'wix314'
          Expand-Archive $archive -DestinationPath $wixDir
          "WIX_BIN=$wixDir" >> $env:GITHUB_ENV

      - name: Test shared service lifecycle
        run: |
          $arch = if ('${{ matrix.os }}' -eq 'windows-11-arm') { 'arm64' } else { 'x64' }
          $wixBin = if ($env:WIX_BIN) { $env:WIX_BIN } else { "$env:WIX\bin" }
          .\resources\win\test_service_msm.ps1 -Architecture $arch -WixBin $wixBin

      - name: Build installer
        if: matrix.os == 'windows-latest'
        working-directory: ./dist
        run: .\scripts\make_msi.ps1 -SourceDir .\ykman

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist

  sign-exe:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Check tag format
        run: |
          if [[ "${GITHUB_REF}" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "Tag matches format"
          else
            echo "Invalid tag format"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test signed artifact extraction
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ykman-builds-windows-x64
          path: ykman-builds-windows

      - name: docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ci@yubico.com
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: write service account credentials
        env:
          GAC: ${{ secrets.SCRIBE_SA }}
        run: |
          echo "${GAC}" > scribe_sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/scribe/scribe_sa.json" >> $GITHUB_ENV

      - name: run scribe sign exe
        run: >
          docker run
          --user $(id -u):$(id -g)
          --volume $(pwd):/scribe
          --env-file <(env)
          ghcr.io/yubico/scribe-ci:v1
          --project-id scribe-prod-987134
          --bucket scribe-u-pub-ykman-fqj0hy
          --config /scribe/.github/scribe-sign-exe-dll.yml
          submit .
          --synchronous
          --download-artifacts

      - name: unpack signed exe
        run: |
          mkdir -p signed
          mv scribe-download/*/sign-source/1.zip signed/
          python3 .github/scripts/extract_signed_zip.py signed/1.zip signed
          rm signed/1.zip
          cp signed/ykman.exe ykman-builds-windows/ykman/ykman.exe
          cp signed/ykman-svc.exe ykman-builds-windows/ykman/ykman-svc.exe

      - name: upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-files
          path: ykman-builds-windows

  build-msi:
    needs: [sign-exe]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-files
          path: ykman-builds-windows

      - name: Build installer
        working-directory: .\ykman-builds-windows
        run: .\scripts\make_msi.ps1 -SourceDir .\ykman

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ykman-installer-windows
          path: .\ykman-builds-windows

  sign-msi:
    needs: [build-msi]
    runs-on: ubuntu-latest
    steps:
    - name: checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ykman-installer-windows
        path: ykman-builds-windows

    - name: docker login
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ci@yubico.com
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: write service account credentials
      env:
        GAC: ${{ secrets.SCRIBE_SA }}
      run: |
        echo "${GAC}" > scribe_sa.json
        echo "GOOGLE_APPLICATION_CREDENTIALS=/scribe/scribe_sa.json" >> $GITHUB_ENV

    - name: run scribe sign msi
      run: >
        docker run
        --user $(id -u):$(id -g)
        --volume $(pwd):/scribe
        --env-file <(env)
        ghcr.io/yubico/scribe-ci:v1
        --project-id scribe-prod-987134
        --bucket scribe-u-pub-ykman-fqj0hy
        --config /scribe/.github/scribe-sign-msi.yml
        submit .
        --synchronous
        --download-artifacts

    - name: unpack signed msi
      run: |
        mkdir -p signed
        mv scribe-download/*/sign-source/1.zip signed/
        python3 .github/scripts/extract_signed_zip.py signed/1.zip signed
        rm signed/1.zip
        cp signed/ykman.msi ykman-builds-windows/ykman.msi

    - name: upload signed artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: signed-files-and-msi
        path: ykman-builds-windows

  sign-exe-arm64:
    if: startsWith(github.ref, 'refs/tags/')
    # Scribe's job events can cross submissions when signing the same tag concurrently.
    needs: [build, sign-msi]
    runs-on: ubuntu-latest
    steps:
      - name: Check tag format
        run: |
          [[ "${GITHUB_REF}" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test signed artifact extraction
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Download ARM64 build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ykman-builds-windows-arm64
          path: ykman-builds-windows-arm64

      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ci@yubico.com
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write service account credentials
        env:
          GAC: ${{ secrets.SCRIBE_SA }}
        run: |
          echo "${GAC}" > scribe_sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/scribe/scribe_sa.json" >> $GITHUB_ENV

      - name: Sign ARM64 executables
        run: >
          docker run
          --user $(id -u):$(id -g)
          --volume $(pwd):/scribe
          --env-file <(env)
          ghcr.io/yubico/scribe-ci:v1
          --project-id scribe-prod-987134
          --bucket scribe-u-pub-ykman-fqj0hy
          --config /scribe/.github/scribe-sign-exe-dll-arm64.yml
          submit .
          --synchronous
          --download-artifacts

      - name: Replace unsigned executables
        run: |
          mkdir -p signed
          mv scribe-download/*/sign-source/1.zip signed/
          python3 .github/scripts/extract_signed_zip.py signed/1.zip signed
          rm signed/1.zip
          cp signed/ykman.exe ykman-builds-windows-arm64/ykman/ykman.exe
          cp signed/ykman-svc.exe ykman-builds-windows-arm64/ykman/ykman-svc.exe

      - name: Upload signed ARM64 executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-files-arm64
          path: ykman-builds-windows-arm64
          if-no-files-found: error
          compression-level: 0

  build-msi-arm64:
    needs: [sign-exe-arm64]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download signed ARM64 executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-files-arm64
          path: ykman-builds-windows-arm64

      - name: Install WiX 3.14.1
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          Invoke-WebRequest 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31') {
            throw 'WiX download checksum mismatch'
          }
          $wixDir = Join-Path $env:RUNNER_TEMP 'wix314'
          Expand-Archive $archive -DestinationPath $wixDir
          "WIX_BIN=$wixDir" >> $env:GITHUB_ENV

      - name: Build ARM64 MSI from signed executables
        working-directory: .\ykman-builds-windows-arm64
        run: .\scripts\make_msi.ps1 -SourceDir .\ykman -Architecture arm64 -WixBin $env:WIX_BIN

      - name: Upload unsigned ARM64 MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ykman-installer-windows-arm64
          path: .\ykman-builds-windows-arm64
          if-no-files-found: error

  sign-msi-arm64:
    needs: [build-msi-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download unsigned ARM64 MSI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ykman-installer-windows-arm64
          path: ykman-builds-windows-arm64

      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ci@yubico.com
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write service account credentials
        env:
          GAC: ${{ secrets.SCRIBE_SA }}
        run: |
          echo "${GAC}" > scribe_sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/scribe/scribe_sa.json" >> $GITHUB_ENV

      - name: Sign ARM64 MSI
        run: >
          docker run
          --user $(id -u):$(id -g)
          --volume $(pwd):/scribe
          --env-file <(env)
          ghcr.io/yubico/scribe-ci:v1
          --project-id scribe-prod-987134
          --bucket scribe-u-pub-ykman-fqj0hy
          --config /scribe/.github/scribe-sign-msi-arm64.yml
          submit .
          --synchronous
          --download-artifacts

      - name: Replace unsigned MSI
        run: |
          mkdir -p signed
          mv scribe-download/*/sign-source/1.zip signed/
          python3 .github/scripts/extract_signed_zip.py signed/1.zip signed
          rm signed/1.zip
          cp signed/ykman-arm64.msi ykman-builds-windows-arm64/ykman-arm64.msi

      - name: Upload signed ARM64 installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-files-and-msi-arm64
          path: ykman-builds-windows-arm64
          if-no-files-found: error
          compression-level: 0

  verify-arm64-signatures:
    needs: [sign-msi-arm64]
    runs-on: windows-11-arm
    steps:
      - name: Download signed ARM64 installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-files-and-msi-arm64
          path: signed

      - name: Verify signatures
        run: |
          foreach ($file in @('signed\ykman\ykman.exe', 'signed\ykman\ykman-svc.exe', 'signed\ykman-arm64.msi')) {
            if ((Get-AuthenticodeSignature $file).Status -ne 'Valid') {
              throw "$file does not have a valid signature"
            }
          }
