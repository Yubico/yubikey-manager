name: Windows

on: [push, pull_request]

permissions: read-all

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: Build - ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "2"

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ykman-builds-windows-x64
          - os: windows-11-arm
            artifact: ykman-builds-windows-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          build-warnings: ""
          rustflags: ""
          cache: true
          cache-save-if: ${{ github.event_name == 'push' }}

      - name: Build Rust CLI
        shell: bash
        run: |
          cargo build --locked --release -p ykman-cli -p ykman-svc
          mkdir -p dist/ykman
          cp target/release/ykman.exe dist/ykman/
          cp target/release/ykman-svc.exe dist/ykman/
          dist/ykman/ykman.exe --version

      - name: Test MSI version extraction
        run: .\resources\win\test_msi_version.ps1

      - name: Verify executable versions
        run: |
          $packages = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Cargo package versions' }
          foreach ($expected in @(
            @{ File = 'ykman.exe'; Package = 'ykman-cli'; Build = 0 },
            @{ File = 'ykman-svc.exe'; Package = 'ykman-svc'; Build = 0 }
          )) {
            $version = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "dist/ykman/$($expected.File)").Path)
            $file = "$($version.FileMajorPart).$($version.FileMinorPart).$($version.FileBuildPart).$($version.FilePrivatePart)"
            $product = "$($version.ProductMajorPart).$($version.ProductMinorPart).$($version.ProductBuildPart).$($version.ProductPrivatePart)"
            $text = ($packages | Where-Object name -eq $expected.Package).version
            $cargoVersion = [version]$text.Split('-')[0]
            $numeric = "$($cargoVersion.Major).$($cargoVersion.Minor).$($expected.Build).0"
            if ($file -ne $numeric -or $product -ne $numeric) {
              throw "$($expected.File) has unexpected numeric versions: file=$file, product=$product"
            }
            if ($version.FileVersion -ne $text -or $version.ProductVersion -ne $text) {
              throw "$($expected.File) must retain its Cargo version text: $text"
            }
          }

      - name: Copy scripts
        shell: bash
        run: cp -r resources/win dist/scripts

      - name: Install WiX for ARM64 validation
        if: matrix.os == 'windows-11-arm'
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          Invoke-WebRequest 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31') {
            throw 'WiX download checksum mismatch'
          }
          $wixDir = Join-Path $env:RUNNER_TEMP 'wix314'
          Expand-Archive $archive -DestinationPath $wixDir
          "WIX_BIN=$wixDir" >> $env:GITHUB_ENV

      - name: Test shared service lifecycle
        run: |
          $arch = if ('${{ matrix.os }}' -eq 'windows-11-arm') { 'arm64' } else { 'x64' }
          $wixBin = if ($env:WIX_BIN) { $env:WIX_BIN } else { "$env:WIX\bin" }
          .\resources\win\test_service_msm.ps1 -Architecture $arch -WixBin $wixBin

      - name: Build installer
        if: matrix.os == 'windows-latest'
        working-directory: ./dist
        run: .\scripts\make_msi.ps1 -SourceDir .\ykman

      - name: Verify installer and service module versions
        if: matrix.os == 'windows-latest'
        run: .\resources\win\test_installer_versions.ps1 -BuildDir .\dist

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist
          if-no-files-found: error

  sign-exe:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.build.result != 'skipped' }}
    needs: [build]
    outputs:
      architectures: ${{ steps.prepare.outputs.architectures }}
    # Scribe's job events can cross submissions for the same tag.
    concurrency:
      group: windows-scribe-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Check tag format
        run: |
          if [[ "${GITHUB_REF}" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]; then
            echo "Tag matches format"
          else
            echo "Invalid tag format"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test signing artifact handling
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Download successful builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ykman-builds-windows-*
          path: artifacts

      - name: Prepare available architectures for signing
        id: prepare
        run: python3 .github/scripts/windows_signing.py prepare binaries artifacts signing-input >> "$GITHUB_OUTPUT"

      - name: docker login
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ci@yubico.com
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: write service account credentials
        env:
          GAC: ${{ secrets.SCRIBE_SA }}
        run: |
          echo "${GAC}" > scribe_sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/scribe/scribe_sa.json" >> $GITHUB_ENV

      - name: Sign executables and DLLs for all available architectures
        run: >
          docker run
          --user $(id -u):$(id -g)
          --volume $(pwd):/scribe
          --env GOOGLE_APPLICATION_CREDENTIALS
          --env CI
          --env GITHUB_EVENT_NAME
          --env GITHUB_REF
          --env GITHUB_REPOSITORY
          ghcr.io/yubico/scribe-ci:v1.6.0@sha256:459bbfb9a267d60072ebbc5fdfa8e5bfd32637177188470eafc3fadd6218c730
          --project-id scribe-prod-987134
          --bucket scribe-u-pub-ykman-fqj0hy
          --config /scribe/.github/scribe-sign-exe-dll.yml
          submit .
          --synchronous
          --download-artifacts

      - name: Restore signed binaries to their architecture bundles
        run: |
          mkdir -p signed
          mv scribe-download/*/sign-source/1.zip signed/
          python3 .github/scripts/extract_signed_zip.py signed/1.zip signed
          rm signed/1.zip
          python3 .github/scripts/windows_signing.py restore artifacts signing-input signed

      - name: Upload signed x64 binaries
        if: contains(fromJSON(steps.prepare.outputs.architectures), 'x64')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-files
          path: artifacts/ykman-builds-windows-x64
          if-no-files-found: error
          compression-level: 0

      - name: Upload signed ARM64 binaries
        if: contains(fromJSON(steps.prepare.outputs.architectures), 'arm64')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-files-arm64
          path: artifacts/ykman-builds-windows-arm64
          if-no-files-found: error
          compression-level: 0

  build-msi:
    if: ${{ !cancelled() && needs.sign-exe.result == 'success' }}
    needs: [sign-exe]
    name: Build MSI - ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.sign-exe.outputs.architectures) }}
    env:
      SUFFIX: ${{ matrix.arch == 'arm64' && '-arm64' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-files${{ env.SUFFIX }}
          path: ykman-builds-windows

      - name: Install WiX 3.14.1 on ARM64
        if: matrix.arch == 'arm64'
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          Invoke-WebRequest 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31') {
            throw 'WiX download checksum mismatch'
          }
          $wixDir = Join-Path $env:RUNNER_TEMP 'wix314'
          Expand-Archive $archive -DestinationPath $wixDir
          "WIX_BIN=$wixDir" >> $env:GITHUB_ENV

      - name: Build installer
        working-directory: .\ykman-builds-windows
        run: |
          $wixBin = if ($env:WIX_BIN) { $env:WIX_BIN } else { "$env:WIX\bin" }
          .\scripts\make_msi.ps1 -SourceDir .\ykman -Architecture ${{ matrix.arch }} -WixBin $wixBin

      - name: Verify installer and service module versions
        run: .\resources\win\test_installer_versions.ps1 -BuildDir .\ykman-builds-windows -Architecture ${{ matrix.arch }}

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ykman-installer-windows${{ env.SUFFIX }}
          path: .\ykman-builds-windows
          if-no-files-found: error

  sign-msi:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.build-msi.result != 'skipped' }}
    needs: [build-msi]
    outputs:
      architectures: ${{ steps.prepare.outputs.architectures }}
    concurrency:
      group: windows-scribe-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download successful MSI builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ykman-installer-windows*
          path: artifacts

      - name: Prepare available installers for signing
        id: prepare
        run: python3 .github/scripts/windows_signing.py prepare installers artifacts signing-input >> "$GITHUB_OUTPUT"

      - name: Docker login
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ci@yubico.com
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write service account credentials
        env:
          GAC: ${{ secrets.SCRIBE_SA }}
        run: |
          echo "${GAC}" > scribe_sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/scribe/scribe_sa.json" >> $GITHUB_ENV

      - name: Sign all available MSI installers
        run: >
          docker run
          --user $(id -u):$(id -g)
          --volume $(pwd):/scribe
          --env GOOGLE_APPLICATION_CREDENTIALS
          --env CI
          --env GITHUB_EVENT_NAME
          --env GITHUB_REF
          --env GITHUB_REPOSITORY
          ghcr.io/yubico/scribe-ci:v1.6.0@sha256:459bbfb9a267d60072ebbc5fdfa8e5bfd32637177188470eafc3fadd6218c730
          --project-id scribe-prod-987134
          --bucket scribe-u-pub-ykman-fqj0hy
          --config /scribe/.github/scribe-sign-msi.yml
          submit .
          --synchronous
          --download-artifacts

      - name: Restore signed installers
        run: |
          mkdir -p signed
          mv scribe-download/*/sign-source/1.zip signed/
          python3 .github/scripts/extract_signed_zip.py signed/1.zip signed
          rm signed/1.zip
          python3 .github/scripts/windows_signing.py restore artifacts signing-input signed

      - name: Upload signed x64 installer
        if: contains(fromJSON(steps.prepare.outputs.architectures), 'x64')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-files-and-msi
          path: artifacts/ykman-installer-windows
          if-no-files-found: error
          compression-level: 0

      - name: Upload signed ARM64 installer
        if: contains(fromJSON(steps.prepare.outputs.architectures), 'arm64')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-files-and-msi-arm64
          path: artifacts/ykman-installer-windows-arm64
          if-no-files-found: error
          compression-level: 0

  verify-signatures:
    if: ${{ !cancelled() && needs.sign-msi.result == 'success' }}
    needs: [sign-msi]
    name: Verify signatures - ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.sign-msi.outputs.architectures) }}
    env:
      SUFFIX: ${{ matrix.arch == 'arm64' && '-arm64' || '' }}
    steps:
      - name: Download signed installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-files-and-msi${{ env.SUFFIX }}
          path: signed

      - name: Verify signatures
        run: |
          foreach ($file in @('signed\ykman\ykman.exe', 'signed\ykman\ykman-svc.exe', 'signed\ykman${{ env.SUFFIX }}.msi')) {
            if ((Get-AuthenticodeSignature $file).Status -ne 'Valid') {
              throw "$file does not have a valid signature"
            }
          }
