name: Source package

on: [push, pull_request]

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and test - Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      CARGO_PROFILE_DEV_DEBUG: "2"
      MATURIN_PEP517_ARGS: "--locked"
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -qq swig libpcsclite-dev libudev-dev libdbus-1-dev

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          components: clippy,rustfmt
          build-warnings: ""
          rustflags: ""
          cache: true
          cache-save-if: ${{ github.event_name == 'push' }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-deny

      - name: Install the project
        run: uv sync --locked

      - name: Run pre-commit hooks
        run: |
          uv tool install pre-commit
          pre-commit run --all-files --verbose

      - name: Run unit tests
        run: uv run --locked pytest

      - name: Create source packages
        if: matrix.python-version == '3.14'
        run: |
          export SOURCE_DATE_EPOCH=$(git show --no-patch --format=%ct)
          uv build --package yubikit --sdist
          uv build --package yubikey-manager --sdist
          git diff --exit-code -- Cargo.lock uv.lock
          mkdir artifacts
          mv dist/yubikit-*.tar.gz artifacts/
          mv dist/yubikey_manager-*.tar.gz artifacts/

      - name: Upload source packages
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yubikey-manager-source-package
          path: artifacts

      - name: Build sphinx documentation
        if: matrix.python-version == '3.14'
        run: uv run --locked make -C docs/ html

      - name: Upload documentation
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yubikey-manager-docs
          path: docs/_build/html
