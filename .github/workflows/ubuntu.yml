name: Ubuntu

on: [push, pull_request]

permissions: read-all

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: Build - ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ykman-builds-linux-x64
            target: x86_64-unknown-linux-gnu.2.28
            rust-target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            artifact: ykman-builds-linux-arm64
            target: aarch64-unknown-linux-gnu.2.28
            rust-target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -qq libpcsclite-dev libudev-dev libdbus-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      - name: Install cargo plugins
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-zigbuild,cargo-about

      - name: Build Rust CLI
        run: |
          target="${{ matrix.target }}"
          cargo zigbuild --release --target "$target" -p ykman-cli
          target_dir="target/${target%%.*}/release"
          mkdir -p dist
          cp "$target_dir/ykman" dist/
          dist/ykman --version

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist

  test:
    runs-on: ubuntu-latest
    name: Rust tests (no hardware)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -qq libpcsclite-dev libudev-dev libdbus-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-about
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-about

      - name: Run non-hardware tests
        run: cargo test --workspace --all-features --lib --bins

      - name: Compile hardware integration tests
        run: cargo test -p yubikit --tests --no-run
