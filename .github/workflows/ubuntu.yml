name: Ubuntu

on: [push, pull_request]

permissions: read-all

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: Build - ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ykman-builds-linux-x64
            target: x86_64-unknown-linux-gnu.2.28
            rust-target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            artifact: ykman-builds-linux-arm64
            target: aarch64-unknown-linux-gnu.2.28
            rust-target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -qq libpcsclite-dev libudev-dev libdbus-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli

      - name: Build Rust CLI
        run: |
          target="${{ matrix.target }}"
          cargo zigbuild --release --target "$target" -p ykman-cli
          target_dir="target/${target%%.*}/release"
          mkdir -p dist
          cp "$target_dir/ykman" dist/
          dist/ykman --version

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist

  test:
    runs-on: ubuntu-latest
    name: Rust tests (no hardware)
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -qq libpcsclite-dev libudev-dev libdbus-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli

      - name: Run non-hardware tests
        run: cargo test --workspace --all-features --lib --bins

      - name: Compile hardware integration tests
        run: cargo test -p yubikit --tests --no-run
