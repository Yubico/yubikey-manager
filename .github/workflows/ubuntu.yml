name: Ubuntu

on: [push, pull_request]

permissions: read-all

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: Build - ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "2"

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ykman-builds-linux-x64
            target: x86_64-unknown-linux-gnu.2.28
            rust-target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            artifact: ykman-builds-linux-arm64
            target: aarch64-unknown-linux-gnu.2.28
            rust-target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -qq libpcsclite-dev libudev-dev libdbus-1-dev

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          target: ${{ matrix.rust-target }}
          build-warnings: ""
          rustflags: ""
          cache: true
          cache-save-if: ${{ github.event_name == 'push' }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      - name: Install cargo plugins
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-zigbuild

      - name: Build Rust CLI
        run: |
          target="${{ matrix.target }}"
          cargo zigbuild --locked --release --target "$target" -p ykman-cli
          target_dir="target/${target%%.*}/release"
          mkdir -p dist
          cp "$target_dir/ykman" dist/
          dist/ykman --version

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist

  msrv:
    runs-on: ubuntu-latest
    name: Rust MSRV (1.88.0)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -qq libpcsclite-dev libudev-dev libdbus-1-dev

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: "1.88.0"
          build-warnings: ""
          rustflags: ""
          cache: true
          cache-save-if: ${{ github.event_name == 'push' }}

      - name: Check all targets and features
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run non-hardware tests
        run: cargo test --locked --workspace --all-features --lib --bins -- --test-threads="$(nproc)"

  test:
    runs-on: ubuntu-latest
    name: Rust tests (no hardware)
    env:
      CARGO_PROFILE_DEV_DEBUG: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -qq libpcsclite-dev libudev-dev libdbus-1-dev

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          build-warnings: ""
          rustflags: ""
          cache: true
          cache-save-if: ${{ github.event_name == 'push' }}

      - name: Install cargo-about
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-about@0.9.1

      - name: Check bundled CLI licenses
        run: |
          cargo fetch --locked
          cargo about generate --locked --offline --all-features --fail \
            --manifest-path crates/ykman-cli/Cargo.toml \
            --config crates/ykman-cli/about.toml \
            --output-file "$RUNNER_TEMP/ykman-licenses.txt" \
            crates/ykman-cli/about-cli.hbs
          diff -u crates/ykman-cli/licenses.txt "$RUNNER_TEMP/ykman-licenses.txt"

      - name: Run non-hardware tests
        run: cargo test --locked --workspace --all-features --lib --bins -- --test-threads="$(nproc)"

      - name: Build Rust API documentation
        env:
          DOCS_RS: "1"
          RUSTDOCFLAGS: "-D warnings"
        run: |
          for crate in yubikit ykman ykman-cli ykman-svc; do
            cargo doc --locked --no-deps --all-features -p "$crate"
          done

      - name: Verify crate packages without cargo-about
        run: |
          export PATH="$(dirname "$(rustup which rustc)"):/usr/bin:/bin"
          if command -v cargo-about; then
            echo "cargo-about must not be available for package verification" >&2
            exit 1
          fi
          cargo package --locked --workspace --exclude yubikit-pyo3

      - name: Compile hardware integration tests
        run: cargo test --locked -p yubikit --tests --no-run
