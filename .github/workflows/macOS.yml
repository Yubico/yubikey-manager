name: macOS

on: [push, pull_request]

permissions: read-all

jobs:
  build:
    runs-on: macos-latest
    name: Build (universal)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin aarch64-apple-darwin

      - name: Install cargo-about
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-about

      - name: Build Rust CLI (universal)
        run: |
          cargo build --release -p ykman-cli --target aarch64-apple-darwin
          cargo build --release -p ykman-cli --target x86_64-apple-darwin
          mkdir -p dist/ykman
          lipo -create \
            target/aarch64-apple-darwin/release/ykman \
            target/x86_64-apple-darwin/release/ykman \
            -output dist/ykman/ykman
          dist/ykman/ykman --version

      - name: Copy scripts
        run: cp -r resources/macos dist/scripts

      - name: Build installer
        working-directory: ./dist
        run: ./scripts/make_pkg.sh

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ykman-builds-macos
          path: dist
