name: macOS

on: [push, pull_request]

permissions: read-all

jobs:
  build:
    runs-on: macos-latest
    name: Build (universal)
    env:
      CARGO_PROFILE_DEV_DEBUG: "2"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          target: x86_64-apple-darwin aarch64-apple-darwin
          build-warnings: ""
          rustflags: ""
          cache: true
          cache-save-if: ${{ github.event_name == 'push' }}

      - name: Build Rust CLI (universal)
        run: |
          cargo build --locked --release -p ykman-cli --target aarch64-apple-darwin
          cargo build --locked --release -p ykman-cli --target x86_64-apple-darwin
          mkdir -p dist/ykman
          lipo -create \
            target/aarch64-apple-darwin/release/ykman \
            target/x86_64-apple-darwin/release/ykman \
            -output dist/ykman/ykman
          dist/ykman/ykman --version

      - name: Copy scripts
        run: cp -r resources/macos dist/scripts

      - name: Build installer
        working-directory: ./dist
        run: ./scripts/make_pkg.sh

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ykman-builds-macos
          path: dist
