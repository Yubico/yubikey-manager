[package]
name = "ykman-svc"
version = "1.0.0-beta.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "YubiKey Manager background service"
readme = "README.md"
keywords = ["yubikey", "service", "daemon"]
categories = ["authentication", "hardware-support"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[[bin]]
name = "ykman-svc"
path = "src/main.rs"

[dependencies]
yubikit = { workspace = true, default-features = true }
ykman = { workspace = true, default-features = true }
anyhow.workspace = true
clap.workspace = true
log = { workspace = true, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
ctrlc.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-service.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[lints]
workspace = true

[build-dependencies]
winresource.workspace = true
